services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inclin
      POSTGRES_PASSWORD: inclin
      POSTGRES_DB: inclin
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inclin -d inclin"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://inclin:inclin@db:5432/inclin
      PORT: "3000"
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  pgdata:
